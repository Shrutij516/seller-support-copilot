name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:8000/"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://copilot:copilot@localhost:5432/copilot
      DYNAMODB_ENDPOINT_URL: http://localhost:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.18"
          working-directory: services/api
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations are reversible (upgrade / downgrade / upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Create DynamoDB "chat" table
        run: uv run python -m copilot_api.scripts.dynamodb_init
      - name: Unit tests
        run: uv run pytest --cov=copilot_api --cov-report=term-missing
      - name: Integration tests
        run: uv run pytest -m integration --cov=copilot_api --cov-append --cov-report=term-missing
      - name: Coverage gate (85%)
        run: uv run coverage report --fail-under=85
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m copilot_api.scripts.export_openapi
          git diff --exit-code -- openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build services/api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CDK_DISABLE_CLI_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Synth (no deploy)
        run: npx cdk synth -c budgetEmail=ci@example.com > /dev/null
