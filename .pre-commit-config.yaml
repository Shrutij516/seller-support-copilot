# Install with `pre-commit install` (see README). Hooks: ruff for Python, prettier for everything else.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        types_or: [ts, tsx, javascript, json, css, markdown, yaml]
