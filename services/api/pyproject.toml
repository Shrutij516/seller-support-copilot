[project]
name = "copilot-api"
version = "0.1.0"
description = "Seller Support Copilot API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.6",
    "boto3>=1.40.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "python-ulid>=3.0.0",
    "pyjwt[crypto]>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "boto3-stubs[dynamodb]>=1.40.0",
    "faker>=33.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test. S106/S107: minted-JWT claim values like
# token_use="id" look like hardcoded passwords to bandit but aren't secrets.
"tests/**" = ["S101", "S106", "S107"]
# Domain error names (OrderNotFound, NotEligible, AlreadyRequested) read better without the
# redundant "Error" suffix in call sites like `raise NotEligible(...)`.
"src/copilot_api/services/refunds.py" = ["N818"]
# FastAPI's own recommended pattern is Depends(...)/Query(...) as a parameter default;
# B008 exists for mutable-default bugs in general Python, not this.
"src/copilot_api/routers/**" = ["B008"]
"src/copilot_api/auth.py" = ["B008"]
# Deterministic synthetic test data, not a security context; a fixed seed is the whole point.
"src/copilot_api/scripts/seed.py" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: needs real Postgres and DynamoDB Local (run with `pytest -m integration`)",
]
filterwarnings = [
    # starlette.testclient still requires httpx and warns once on import; not actionable until
    # starlette ships its replacement.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["copilot_api"]
branch = true

[tool.coverage.report]
# Business logic mostly lives behind integration tests (real Postgres/DynamoDB); the
# combined unit + integration run is what's measured against the 85% gate, not either alone.
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
